<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サテンブラウス作品検索 v14</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f5f5f7;margin:0;color:#222}main{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #0001}h1{font-size:23px;margin:0 0 8px}h2{font-size:18px}.small{font-size:13px;color:#666;line-height:1.6}input{width:100%;margin:10px 0}button{width:100%;padding:14px;margin:6px 0;border:0;border-radius:12px;background:#111;color:#fff;font-size:16px;font-weight:700}.preview{max-width:100%;max-height:420px;border-radius:12px;display:none}#status{background:#f0f0f3;padding:12px;border-radius:10px;white-space:pre-wrap}.result{padding:13px 0;border-top:1px solid #ddd}.result a{font-weight:700;color:#0645ad;text-decoration:none}.tag{display:inline-block;background:#eee;border-radius:8px;padding:3px 7px;margin:3px;font-size:12px}</style></head><body><main><div class="card"><h1>サテンブラウス作品検索 v14</h1><p><b>API ID不要・FANZA限定なし</b><br>サンプル画像を検索エンジンへ送り、画像検索で見つかったWebページを取得・整理し、「サテンブラウス」「動画」「作品」などとの関連度で候補をランキングします。</p><input id="file" type="file" accept="image/*"><img id="preview" class="preview"></div><div class="card"><button id="search">この画像から作品名を検索</button><div id="status">画像を選択してください。</div></div><div id="results" class="card" style="display:none"><h2>作品候補</h2><div id="list"></div></div><div class="card"><p class="small"><b>重要：</b>このv14はGitHub Pages単体では動きません。画像検索結果を取得してアプリ内に表示するため、Cloudflare Pages Functionsなどのサーバー側処理が必要です。フォルダ内の <code>functions/api/search.js</code> がその処理です。無料枠での公開を想定しています。</p></div></main><script>let f=null;const $=id=>document.getElementById(id);$("file").onchange=e=>{f=e.target.files?.[0]||null;if(f){$("preview").src=URL.createObjectURL(f);$("preview").style.display="block";$("status").textContent="画像を選択しました。"}};$("search").onclick=async()=>{if(!f){$("status").textContent="先に画像を選択してください。";return}$("status").textContent="画像検索中…\n画像→検索エンジン→候補ページ抽出→サテンブラウス関連度判定を行っています。";$("results").style.display="none";try{const fd=new FormData();fd.append("image",f);const r=await fetch("/api/search",{method:"POST",body:fd});const d=await r.json();if(!r.ok)throw new Error(d.error||"検索に失敗しました");render(d.results||[]);$("status").textContent=`検索完了：${d.results?.length||0}件の候補を抽出しました。`; }catch(e){$("status").textContent="検索エラー："+e.message+"\n\nCloudflare Pagesへデプロイ後に使用してください。"}};function render(rs){$("results").style.display="block";$("list").innerHTML=rs.length?rs.map((x,i)=>`<div class="result"><div><b>${i+1}位</b>　関連度 ${x.score}</div><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title||x.url)}</a><p class="small">${esc(x.snippet||"")}</p>${(x.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`).join(""):'候補ページを取得できませんでした。画像を変えて再検索してください。'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
