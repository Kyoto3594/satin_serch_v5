<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サテンブラウス作品検索 v14 修正版2</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f4f5f7;color:#222;margin:0}main{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:15px;padding:17px;margin:13px 0;box-shadow:0 2px 8px #0000000d}h1{font-size:23px;margin:0 0 8px}h2{font-size:18px;margin:0 0 10px}p{line-height:1.55}.note{font-size:13px;color:#666}input[type=file]{width:100%;margin:12px 0}#preview{display:none;max-width:100%;max-height:360px;border-radius:12px}button{width:100%;padding:14px;margin:6px 0;border:0;border-radius:11px;background:#171717;color:#fff;font-size:16px;font-weight:700}button:disabled{opacity:.5}.secondary{background:#e9e9ed;color:#171717}#status{white-space:pre-wrap;background:#f0f1f4;padding:12px;border-radius:10px;font-size:14px;overflow-wrap:anywhere}.result{border-top:1px solid #ddd;padding:12px 0;overflow-wrap:anywhere}.result a{font-weight:700;color:#0645ad}</style></head><body><main><div class="card"><h1>サテンブラウス作品検索 v14 修正版2</h1><p><b>API ID不要・FANZA限定なし</b><br>選択した画像から作品ページ候補の検索を試みます。</p><input id="file" type="file" accept="image/*"><img id="preview" alt="選択画像"></div><div class="card"><h2>画像から作品候補を検索</h2><button id="search">選択画像で作品候補を検索</button><div id="status">まず画像を選択してください。</div><div id="results"></div></div><div class="card"><h2>補助検索</h2><button class="secondary" id="web">サテンブラウスの作品をWeb検索</button><p class="note">Google LensのWeb画面は一般開発者向けの固定保証された逆画像検索APIではありません。画像の自動検索がサービス側に拒否された場合は、その旨をエラーとして表示します。</p></div></main><script>const $=id=>document.getElementById(id);let selected=null;$('file').addEventListener('change',()=>{selected=$('file').files?.[0]||null;$('results').innerHTML='';if(!selected){$('preview').style.display='none';$('status').textContent='まず画像を選択してください。';return;}$('preview').src=URL.createObjectURL(selected);$('preview').style.display='block';$('status').textContent='画像を選択しました。検索ボタンを押してください。';});$('search').addEventListener('click',async()=>{if(!selected){$('status').textContent='先に画像を選択してください。';return;}$('search').disabled=true;$('results').innerHTML='';$('status').textContent='画像を送信しています…';try{const fd=new FormData();fd.append('image',selected,selected.name||'sample.jpg');const r=await fetch('/api/search',{method:'POST',body:fd,headers:{'Accept':'application/json'}});const ct=r.headers.get('content-type')||'';const raw=await r.text();let data;try{data=JSON.parse(raw)}catch{const excerpt=raw.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,220);throw new Error(`サーバーからJSON以外の応答が返りました（HTTP ${r.status} / ${ct||'Content-Type不明'}）。応答: ${excerpt||'本文なし'}。Workerのルーティングまたはデプロイ設定を確認してください。`)}if(!r.ok)throw new Error(data.error||('HTTP '+r.status));$('status').textContent=data.message||'処理が終了しました。';if(!data.results?.length){$('results').innerHTML='<p>作品候補を抽出できませんでした。検索サービス側の拒否、または検索結果ページの仕様変更が原因の可能性があります。</p>'}else $('results').innerHTML=data.results.map((x,i)=>`<div class="result"><b>#${i+1}</b> <a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title||x.url)}</a><div>${esc(x.snippet||'')}</div><small>関連語スコア: ${Number(x.score||0)}</small></div>`).join('')}catch(e){$('status').textContent='検索エラー: '+(e?.message||String(e))}finally{$('search').disabled=false}});$('web').onclick=()=>window.open('https://www.google.com/search?q='+encodeURIComponent('"サテンブラウス" 動画 作品名'),'_blank','noopener');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
