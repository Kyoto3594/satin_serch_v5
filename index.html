<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>サテンブラウス画像検索 v8</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;margin:0;background:#f5f5f7;color:#222}
main{max-width:760px;margin:auto;padding:20px}
h1{font-size:24px;margin:0 0 6px}
.ver{display:inline-block;padding:4px 9px;border-radius:999px;background:#111;color:#fff;font-size:13px}
.card{background:white;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 2px 12px #00000012}
button{font-size:16px;padding:12px 16px;border:0;border-radius:12px;background:#111;color:#fff;margin:6px 4px 6px 0}
button:disabled{opacity:.45}
input[type=file]{width:100%;font-size:16px}
#status{white-space:pre-wrap;line-height:1.5}
#diag{white-space:pre-wrap;word-break:break-all;font-size:12px;background:#f0f0f0;padding:10px;border-radius:10px}
img{max-width:100%;border-radius:10px}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<main>
<h1>サテンブラウス画像検索 <span class="ver">v8</span></h1>
<div class="small">MobileCLIP公式の読み込み方法を使用。iPhoneではWASM・1スレッドで実行します。</div>

<div class="card">
<button id="load">AIモデルを起動</button>
<div id="status">待機中</div>
</div>

<div class="card">
<input id="files" type="file" accept="image/*" multiple disabled>
<button id="analyze" disabled>写真を解析</button>
<div class="small">まずAIモデルを起動してください。最初は写真1枚で確認してください。</div>
<div id="results"></div>
</div>

<div class="card">
<b>診断情報</b>
<div id="diag">まだありません</div>
</div>
</main>

<script type="module">
import {
  env,
  AutoTokenizer,
  CLIPTextModelWithProjection,
  AutoProcessor,
  CLIPVisionModelWithProjection,
  RawImage,
  dot,
  softmax
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0/+esm";

env.allowLocalModels = false;
env.useBrowserCache = true;
// iPhone Safariでは並列WASMスレッドを使わず、メモリ負荷を抑える
if (env.backends?.onnx?.wasm) {
  env.backends.onnx.wasm.numThreads = 1;
  env.backends.onnx.wasm.proxy = false;
}

const MODEL = "Xenova/mobileclip_s0";
const statusEl = document.getElementById("status");
const diagEl = document.getElementById("diag");
const loadBtn = document.getElementById("load");
const filesEl = document.getElementById("files");
const analyzeBtn = document.getElementById("analyze");
const resultsEl = document.getElementById("results");

let tokenizer, textModel, processor, visionModel, textEmbeds;
let ready = false;

function status(s){ statusEl.textContent=s; }
function diag(s){ diagEl.textContent=s; }

async function start() {
  loadBtn.disabled = true;
  status("AIモデルを読み込んでいます…（初回は数十MBのダウンロードがあります）");
  diag("開始: " + new Date().toISOString());

  try {
    // MobileCLIP公式READMEと同じ構成。
    // 特にVision modelは量子化せず、quantized:falseを明示する。
    tokenizer = await AutoTokenizer.from_pretrained(MODEL);
    status("1/4 テキストモデルを準備中…");

    textModel = await CLIPTextModelWithProjection.from_pretrained(MODEL, {
      device: "wasm"
    });
    status("2/4 画像プロセッサを準備中…");

    processor = await AutoProcessor.from_pretrained(MODEL);
    status("3/4 Visionモデルを準備中…");

    visionModel = await CLIPVisionModelWithProjection.from_pretrained(MODEL, {
      device: "wasm",
      quantized: false
    });
    status("4/4 検索語を準備中…");

    const labels = [
      "a person wearing a satin blouse",
      "a person wearing a shiny satin shirt or blouse",
      "a person wearing a regular cotton blouse",
      "a person not wearing a blouse"
    ];
    const textInputs = tokenizer(labels, {padding:"max_length", truncation:true});
    const out = await textModel(textInputs);
    textEmbeds = out.text_embeds.normalize();

    ready = true;
    filesEl.disabled = false;
    analyzeBtn.disabled = false;
    status("AIモデルの起動に成功しました。写真を1枚選んで解析できます。");
    diag("SUCCESS: MobileCLIP-S0 / official component loading / WASM / vision quantized:false");
  } catch (e) {
    ready = false;
    loadBtn.disabled = false;
    status("AIモデルを起動できませんでした。");
    diag("ERROR TYPE: " + (e?.name || "unknown") + "\nMESSAGE: " + (e?.message || String(e)) +
         "\nSTACK:\n" + (e?.stack || "(なし)"));
  }
}

async function analyze() {
  if (!ready) return;
  const files = [...filesEl.files];
  if (!files.length) { status("写真を1枚選択してください。"); return; }

  analyzeBtn.disabled = true;
  resultsEl.innerHTML = "";
  const labels = [
    "a person wearing a satin blouse",
    "a person wearing a shiny satin shirt or blouse",
    "a person wearing a regular cotton blouse",
    "a person not wearing a blouse"
  ];

  try {
    for (let i=0;i<files.length;i++) {
      status(`解析中 ${i+1}/${files.length} …`);
      const url = URL.createObjectURL(files[i]);
      try {
        const image = await RawImage.read(url);
        const inputs = await processor(image);
        const {image_embeds} = await visionModel(inputs);
        const normalized = image_embeds.normalize();
        const probs = softmax(normalized.tolist()[0].map((_,j)=>100*dot(normalized.tolist()[0], textEmbeds.tolist()[j])));
        const arr = labels.map((label,j)=>({label,score:probs[j]})).sort((a,b)=>b.score-a.score);
        const div=document.createElement("div");
        div.className="card";
        div.innerHTML="<b>"+(i+1)+"枚目</b><br>"+arr.map(x=>`${x.label}: ${(x.score*100).toFixed(1)}%`).join("<br>");
        resultsEl.appendChild(div);
      } finally {
        URL.revokeObjectURL(url);
      }
    }
    status("解析完了");
  } catch(e) {
    status("解析中にエラーが発生しました。");
    diag("ANALYSIS ERROR: "+(e?.name||"unknown")+"\nMESSAGE: "+(e?.message||String(e))+"\nSTACK:\n"+(e?.stack||"(なし)"));
  } finally {
    analyzeBtn.disabled = false;
  }
}

loadBtn.addEventListener("click", start);
analyzeBtn.addEventListener("click", analyze);
</script>
</body>
</html>
