<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>サンプル画像からFANZA作品検索 v11</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f5f7;color:#111827}
main{max-width:820px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 10px #0001}
h1{font-size:21px;margin:0 0 5px}.ver{font-size:13px;color:#666}h2{font-size:17px;margin:0 0 10px}
input[type=text],input[type=file]{width:100%;font-size:16px;padding:10px;margin:5px 0;border:1px solid #c9c9c9;border-radius:9px}
button{font-size:16px;padding:12px 15px;border:0;border-radius:10px;background:#111827;color:#fff;margin:5px 4px 5px 0}
button:disabled{opacity:.45}#status{white-space:pre-wrap;line-height:1.5}.small{font-size:12px;color:#666;line-height:1.45}
.result{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:10px 0;border-top:1px solid #eee}
.result img{width:120px;height:160px;object-fit:cover;border-radius:8px;background:#eee}.title{font-weight:700;font-size:16px;line-height:1.35}
.score{font-size:18px;font-weight:700;margin:7px 0}.meta{font-size:13px;color:#555;line-height:1.5}a{color:#0759b8}
</style>
</head>
<body>
<main>
<div class="card"><h1>サンプル画像からFANZA作品検索 <span class="ver">v11</span></h1>
<div class="small">画像 → FANZA商品検索 → 各作品のサンプル画像 → AI画像類似度 → 作品名ランキング</div></div>

<div class="card"><h2>① DMM Webサービス</h2>
<input id="apiId" type="text" placeholder="API ID">
<input id="affId" type="text" placeholder="アフィリエイトID（API用）">
<div class="small">DMM Webサービスで発行されたIDを入力してください。アプリには保存しません。</div></div>

<div class="card"><h2>② 検索するサンプル画像</h2>
<input id="file" type="file" accept="image/*">
<button id="modelBtn">AIモデルを起動</button><button id="searchBtn" disabled>作品を検索</button>
<div class="small">まず1枚だけで試してください。</div></div>

<div class="card"><h2>③ 検索範囲</h2>
<label>各キーワードの取得件数：<span id="hitsText">100</span>件</label>
<input id="hits" type="range" min="20" max="100" value="100" step="20">
<div class="small">「ブラウス」「サテン」「シャツ」「トップス」の4系統から候補作品を取得し、重複を除いて画像照合します。</div></div>

<div class="card"><div id="status">AIモデルはまだ起動していません。</div></div>
<div id="results"></div>
</main>

<script type="module">
import {AutoProcessor,CLIPVisionModelWithProjection,RawImage,dot}
from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0/+esm";

const MODEL="Xenova/mobileclip_s0";
let processor=null,visionModel=null,ready=false;
const $=id=>document.getElementById(id);
const status=s=>$("status").textContent=s;
$("hits").addEventListener("input",e=>$("hitsText").textContent=e.target.value);

async function startModel(){
 if(ready)return;
 status("AIモデルを起動しています…\n初回はモデルの読み込みに時間がかかります。");
 processor=await AutoProcessor.from_pretrained(MODEL);
 visionModel=await CLIPVisionModelWithProjection.from_pretrained(MODEL,{device:"wasm",quantized:false});
 ready=true;$("searchBtn").disabled=false;
 status("AIモデルの起動に成功しました。\n検索画像を選択して「作品を検索」を押してください。");
}

function dmmJSONP(params){
 return new Promise((resolve,reject)=>{
  const cb="dmm_cb_"+Date.now()+"_"+Math.floor(Math.random()*100000);
  const script=document.createElement("script");
  const timeout=setTimeout(()=>{cleanup();reject(new Error("DMM APIの応答がタイムアウトしました。API ID・アフィリエイトID・利用登録を確認してください。"));},20000);
  function cleanup(){clearTimeout(timeout);delete window[cb];script.remove();}
  window[cb]=data=>{cleanup();resolve(data);};
  const q=new URLSearchParams({...params,output:"json",callback:cb});
  script.src="https://api.dmm.com/affiliate/v3/ItemList?"+q.toString();
  script.onerror=()=>{cleanup();reject(new Error("DMM APIへ接続できませんでした。"));};
  document.head.appendChild(script);
 });
}

function sampleUrls(item){
 const out=[],s=item?.sampleImageURL?.sample_s?.image,l=item?.sampleImageURL?.sample_l?.image;
 if(Array.isArray(s))out.push(...s);else if(typeof s==="string")out.push(s);
 if(Array.isArray(l))out.push(...l);else if(typeof l==="string")out.push(l);
 if(item?.imageURL?.large)out.push(item.imageURL.large);
 return [...new Set(out)].filter(Boolean);
}
function actress(item){const a=item?.iteminfo?.actress;return Array.isArray(a)?a.map(x=>x?.name).filter(Boolean).join("、"):"";}

async function embedFile(file){
 const image=await RawImage.fromBlob(file),input=await processor(image);
 const {image_embeds}=await visionModel(input);
 return image_embeds.normalize().tolist()[0];
}
async function embedUrl(url){
 const image=await RawImage.read(url),input=await processor(image);
 const {image_embeds}=await visionModel(input);
 return image_embeds.normalize().tolist()[0];
}

async function searchWorks(){
 if(!ready)return;
 const file=$("file").files?.[0],apiId=$("apiId").value.trim(),affId=$("affId").value.trim();
 if(!file){status("検索する画像を選択してください。");return;}
 if(!apiId||!affId){status("API IDとアフィリエイトIDを入力してください。");return;}
 $("searchBtn").disabled=true;$("results").innerHTML="";
 try{
  status("検索画像をAIで解析しています…");
  const query=await embedFile(file);
  const works=new Map(),keywords=["ブラウス","サテン","シャツ","トップス"],hits=Number($("hits").value);
  for(let i=0;i<keywords.length;i++){
   status(`FANZA作品データを取得中…\n${i+1} / ${keywords.length}\n「${keywords[i]}」`);
   const data=await dmmJSONP({api_id:apiId,affiliate_id:affId,site:"FANZA",service:"digital",floor:"videoa",hits,sort:"match",keyword:keywords[i]});
   const result=data?.result;
   if(result?.status&&result.status!==200)throw new Error(result.message||`DMM API error: ${result.status}`);
   for(const item of(result?.items||[])){const key=item.content_id||item.product_id||item.URL;if(key&&!works.has(key))works.set(key,item);}
  }
  const list=[...works.values()];
  if(!list.length){status("候補作品が取得できませんでした。");return;}
  const ranked=[];let ok=0;
  for(let i=0;i<list.length;i++){
   const item=list[i],urls=sampleUrls(item).slice(0,5);let best=-Infinity,bestUrl="";
   for(const url of urls){
    try{const v=await embedUrl(url),s=dot(query,v);if(s>best){best=s;bestUrl=url;}}catch(e){}
   }
   if(best>-Infinity){ranked.push({item,score:best,image:bestUrl});ok++;}
   status(`サンプル画像をAI照合中…\n${i+1} / ${list.length}\n照合成功：${ok}`);
   await new Promise(r=>setTimeout(r,0));
  }
  ranked.sort((a,b)=>b.score-a.score);const top=ranked.slice(0,30);
  if(!top.length){status("作品データは取得できましたが、サンプル画像をブラウザから取得できませんでした。DMM/FANZA画像CDNのCORS制約の可能性があります。");return;}
  const head=document.createElement("div");head.className="card";
  head.innerHTML=`<b>検索結果：${top.length}作品</b><br><span class="small">検索画像と作品サンプル画像の視覚的類似度順です。</span>`;
  $("results").appendChild(head);
  for(let i=0;i<top.length;i++){
   const r=top[i],item=r.item,card=document.createElement("div");card.className="card result";
   const img=document.createElement("img");img.src=r.image;img.alt="作品サンプル";img.onerror=()=>img.style.display="none";
   const body=document.createElement("div"),title=document.createElement("div");title.className="title";title.textContent=`${i+1}. ${item.title||"作品名不明"}`;
   const score=document.createElement("div");score.className="score";score.textContent=`画像類似度 ${(r.score*100).toFixed(1)}%`;
   const meta=document.createElement("div");meta.className="meta";meta.innerHTML=(actress(item)?`出演：${actress(item)}<br>`:"")+(item.date?`発売日：${item.date}<br>`:"");
   const link=document.createElement("a");link.href=item.affiliateURL||item.URL||"#";link.target="_blank";link.rel="noopener";link.textContent="FANZA作品ページを開く";
   body.append(title,score,meta,link);card.append(img,body);$("results").appendChild(card);
  }
  status(`検索完了。\n${top.length}作品を表示しました。`);
 }catch(e){console.error(e);status(`SEARCH ERROR: ${e?.name||"Error"}\nMESSAGE: ${e?.message||e}`);}
 finally{$("searchBtn").disabled=false;}
}
$("modelBtn").addEventListener("click",async()=>{$("modelBtn").disabled=true;try{await startModel();}catch(e){console.error(e);status(`MODEL ERROR: ${e?.name||"Error"}\nMESSAGE: ${e?.message||e}`);$("modelBtn").disabled=false;}});
$("searchBtn").addEventListener("click",searchWorks);
</script>
</body>
</html>
